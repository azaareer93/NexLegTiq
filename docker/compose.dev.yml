# Local backing services for NexLegTiq (MVP-30). Start: `pnpm dev:up` · stop: `pnpm dev:down` · wipe data: `pnpm dev:reset`.
# Credentials here are local-only dev values and match `.env.example`. Every port binds to 127.0.0.1, never the LAN.
name: nexlegtiq

services:
  postgres:
    # Plain postgres:17 lacks pgvector (Phase 2 embeddings); this is PG 17 with the extension installed.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexlegtiq
      POSTGRES_PASSWORD: nexlegtiq
      POSTGRES_DB: nexlegtiq
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Runs once, on an empty data volume: extensions + the nexlegtiq_test database.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexlegtiq -d nexlegtiq']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF so queued BullMQ jobs survive a container restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: nexlegtiq
      MINIO_ROOT_PASSWORD: nexlegtiq-dev-only
    ports:
      - '127.0.0.1:9000:9000' # S3 API
      - '127.0.0.1:9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the documents bucket (idempotent), then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 nexlegtiq nexlegtiq-dev-only &&
        mc mb --ignore-existing local/nexlegtiq-documents-local
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025' # SMTP (no auth, no TLS)
      - '127.0.0.1:8025:8025' # web UI
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    ports: ['127.0.0.1:3310:3310']
    volumes:
      # Signature DB (~300 MB) is downloaded by freshclam on first start; the volume keeps it across restarts.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      # First start downloads signatures before clamd listens.
      start_period: 300s

volumes:
  pg-data:
  redis-data:
  minio-data:
  mailpit-data:
  clamav-db:
