packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - nx
  - prisma
  - '@prisma/engines'
  - unrs-resolver

# Security overrides (pnpm audit --prod, CI). Both are exact-pinned by the Prisma 7.10 CLI, which @prisma/client pulls in
# as an optional peer; neither runs in the app (no MySQL; deepmerge-ts only merges prisma.config). Drop each override once
# a Prisma release ships the patched version.
overrides:
  deepmerge-ts: ^8.0.2 # GHSA-ggr8-5vv4-36mx
  mysql2: ^3.24.5 # GHSA-3f6p-5ww8-9rcr
  # Used by @nestjs/swagger at runtime (YAML docs). Only the vulnerable 5.x range: other tools still need js-yaml 3/4.
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.2 # GHSA-r3ph-w7gj-g6xm
  # Reached through the Prisma CLI (c12 > magicast) and build tools (PostCSS, Vite); a patch release, same API.
  'source-map-js@<1.2.2': ^1.2.2 # GHSA-68fv-2mgg-jv7q
