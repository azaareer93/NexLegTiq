packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - nx
  - prisma
  - '@prisma/engines'
  - unrs-resolver

# Security overrides (pnpm audit --prod, CI). Both are exact-pinned by the Prisma 7.10 CLI, which @prisma/client pulls in
# as an optional peer; neither runs in the app (no MySQL; deepmerge-ts only merges prisma.config). Drop each override once
# a Prisma release ships the patched version.
overrides:
  deepmerge-ts: ^8.0.2 # GHSA-ggr8-5vv4-36mx
  mysql2: ^3.24.5 # GHSA-3f6p-5ww8-9rcr
