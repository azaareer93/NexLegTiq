# Production on one VPS (D-020, D-225): Caddy (TLS, HSTS) → two API containers (api-a, api-b) so a release restarts one
# at a time while Caddy sends traffic to the other; one worker; ClamAV. Postgres (PITR), Redis and object storage are
# managed services reached over TLS; the SPAs are on a CDN (Cloudflare Pages).
# Copied to the host by .github/workflows/release.yml together with Caddyfile and deploy.sh; the host holds three files
# that are never committed: `.env` (IMAGE_REPO, IMAGE_TAG, API_DOMAIN, ADMIN_ALLOWED_IPS — written by deploy.sh),
# `app.env` (backend env, env.schema.ts) and `migrate.env` (DATABASE_URL of the migrator role). See
# docs/runbooks/release.md.
name: nexlegtiq-production

x-backend: &backend
  image: ${IMAGE_REPO:?}/backend-api:${IMAGE_TAG:?}
  env_file: app.env
  restart: unless-stopped
  read_only: true
  # Bounded: OCR writes page images here (10 at a time, D-139) and a tmpfs lives in RAM.
  tmpfs: [/tmp:size=512m]
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  # SIGTERM → Nest closes the HTTP server and finishes in-flight requests (enableShutdownHooks); the worker lets its
  # current jobs end. Docker's default of 10 s would cut long uploads and OCR pages short.
  stop_grace_period: 60s
  depends_on:
    clamav:
      condition: service_healthy

x-api: &api
  <<: *backend
  # Port 3000 is reached through Caddy only; the metrics port 9464 stays on the internal network.
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # No depends_on: Caddy must keep running while deploy.sh replaces api-a and api-b one at a time.

  # Two services rather than `deploy.replicas: 2`: compose recreates replicas of one service together, which is the
  # downtime this pair avoids.
  api-a: *api
  api-b: *api

  worker:
    <<: *backend
    # The runtime plus Tesseract and poppler (D-139); OCR writes page images under the tmpfs /tmp, 10 pages at a time.
    image: ${IMAGE_REPO:?}/backend-api-worker:${IMAGE_TAG:?}
    command: ['node', '--enable-source-maps', 'worker.js']

  clamav:
    image: clamav/clamav:stable
    # clamd refuses streams over 25 MB by default (uploads go up to 50 MiB), and by default passes what it had to skip
    # (content over its limits, encrypted archives) as clean: both are changed here, fail closed (D-126).
    entrypoint:
      - /bin/sh
      - -c
      - grep -q '^StreamMaxLength' /etc/clamav/clamd.conf || printf 'StreamMaxLength 60M\nAlertExceedsMax yes\nAlertEncryptedArchive yes\n' >> /etc/clamav/clamd.conf; exec /init
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      # First start downloads signatures (~300 MB) before clamd listens.
      start_period: 300s

  # One-off: `docker compose run --rm migrate` (deploy.sh), never started by `up`.
  migrate:
    image: ${IMAGE_REPO:?}/backend-api-migrate:${IMAGE_TAG:?}
    # Removed by deploy.sh after each migration; present only while a release runs.
    env_file:
      - path: migrate.env
        required: false
    profiles: [tools]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

volumes:
  caddy-data:
  caddy-config:
  clamav-db:
